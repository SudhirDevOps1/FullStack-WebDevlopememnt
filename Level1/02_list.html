<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in html</title>
</head>

<body>
    <!-- Unorderded list -->
    <ul>
        <li>Bread</li>
        <li>Egg</li>
        <li>Jam</li>
        <li>Souce</li>
    </ul>


    <!-- Ordered list -->
    <ol>
        <li>Bread</li>
        <li>Egg</li>
        <li>Jam</li>
        <li>Souce</li>
    </ol>

    
</body>

</html>
